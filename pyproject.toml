[project]
name = "ddql"
version = "0.2.0"
description = "Due Diligence Quality Lab — evals for investigative risk reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-split>=0.9",
    "ruff>=0.4",
    "mypy>=1.10",
]
anthropic = [
    "anthropic>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast smoke tests",
    "eval: eval harness tests",
    "e2e: end-to-end Playwright tests",
    "unit: pure unit tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ddql"]