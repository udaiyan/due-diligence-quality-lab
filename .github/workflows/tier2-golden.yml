name: T2 — golden eval

on:
  pull_request:
    branches: [main]

concurrency:
  group: t2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --frozen --extra dev --extra anthropic

      - name: Fetch baseline
        id: baseline
        run: uv run python scripts/fetch_baseline.py --out baseline.json
        continue-on-error: true

      # The golden set deliberately includes one case that fails
      # (uni-donor-0231) so the harness can be seen catching a real problem.
      # continue-on-error keeps the workflow green while still writing the
      # report and posting the PR comment.
      - name: Run golden eval
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DDQL_JUDGE: ${{ vars.DDQL_JUDGE || 'null' }}
        run: |
          uv run python scripts/run_eval.py \
            --dataset datasets/golden/v2 \
            --layers L0,L1 \
            --outputs examples/outputs.sample.json \
            --baseline baseline.json \
            --drift-tolerance 0.03 \
            --report reports/t2.json

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/t2.md';
            if (!fs.existsSync(path)) return;
            const md = fs.readFileSync(path, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: md,
            });

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-report
          path: reports/