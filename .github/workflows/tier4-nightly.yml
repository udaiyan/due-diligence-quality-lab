name: T4 — nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra anthropic
      - run: uv run playwright install --with-deps chromium firefox webkit

      - name: Full golden eval with adversarial set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DDQL_JUDGE: ${{ vars.DDQL_JUDGE || 'null' }}
        run: |
          uv run python scripts/run_eval.py \
            --dataset datasets/golden/v2 \
            --layers L0,L1 \
            --outputs examples/outputs.sample.json \
            --report reports/nightly.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report
          path: reports/